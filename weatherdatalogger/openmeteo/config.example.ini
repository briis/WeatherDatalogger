# ============================================================
#  Open-Meteo → MQTT Forecast Datalogger — Configuration
# ============================================================
#
# Copy this file to config.ini and fill in your values.
# config.ini is gitignored — never commit real credentials.
#
# This service polls the free Open-Meteo forecast API for current
# conditions plus hourly/daily forecasts, and republishes them to MQTT under
# weatherdatalogger/forecast-openmeteo-<location>/{current,forecast_hourly,forecast_daily}
# — same topic shape and payload fields as the Visual Crossing service, so
# both can run side by side. Purely lat/lon-based; no API key and no weather
# station required. Free for non-commercial use (data: Open-Meteo.com,
# CC BY 4.0).

[openmeteo]
# Set to true to enable polling.
enabled = false

# REQUIRED — forecast location as decimal latitude/longitude, e.g. 55.6761
latitude =
longitude =

# Open-Meteo weather model — same ids as the Open-Meteo Home Assistant
# integration (aioopenmeteo). Examples:
#   best_match         — Open-Meteo picks the best model for the location (default)
#   dmi_seamless       — DMI HARMONIE (Denmark/Nordics, ~2.5 days) blended with ECMWF after that
#   ecmwf_ifs025       — ECMWF IFS
#   icon_seamless      — DWD ICON
#   metno_seamless     — MET Norway (Nordics)
# Full list: https://open-meteo.com/en/docs (Weather models). A regional
# model that doesn't cover the location is logged as an HTTP 400 warning.
model = best_match

# Number of forecast days to request (today + next N), 1-16. A model with a
# shorter horizon just returns fewer days.
days = 14

# Slug used in the MQTT topic: weatherdatalogger/forecast-openmeteo-<location>/...
# Use a short slug without spaces, e.g. "home", "office", "cabin". Can be the
# same as [visualcrossing] location — the provider segment keeps them apart.
location = home

# How often to poll (minutes). Each poll is one request — the free API allows
# 10,000/day (a 14-day request with this many variables counts as a few).
interval_min = 60

# Only for a commercial Open-Meteo plan — leave empty for the free API.
api_key =

# HTTP request timeout in seconds
timeout_s = 30

[mqtt]
# MQTT broker address and port
broker = localhost
port   = 1883

# Leave empty if your broker requires no authentication
username =
password =

# Set to true if the broker requires TLS/SSL
tls = false

# Base topic — must match the other services' base topic
base_topic = weatherdatalogger

# MQTT client identifier (must be unique per broker)
client_id = openmeteo-datalogger

# Retain the last message on each topic (recommended for Home Assistant/db_writer
# to have a value immediately on (re)connect, rather than waiting for the next poll)
retain = true

# QoS level: 0 = at most once, 1 = at least once, 2 = exactly once
qos = 0

[logging]
# Log level: DEBUG | INFO | WARNING | ERROR
level = INFO

# Optional log file path — leave empty to log to stdout only
file =
