# /etc/weather-radar.ini — optional; every value has a default
[radar]
enabled = true
# doppler (fresher, 120 km per radar) or fullRange (240 km)
scan_type = doppler
# How much history the popup can animate
keep_minutes = 120
# Area to render: W,S,E,N (degrees)
bounds = 6.6,53.9,16.0,58.2
width_px = 1200
# Extrapolate the newest frame along the rain's motion for the next hour
forecast = true
# Echo weaker than this (dBZ) isn't drawn
min_dbz = 7
# Point for nowcast rain rate in frames.json
station_lat = 55.7374
station_lon = 12.1659

[logging]
level = INFO
